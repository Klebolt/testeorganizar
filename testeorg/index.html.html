<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Processos LMS - Excel Import/Export + Filtro + Barra Progresso</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 1rem;
        }

        #container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
        }

        .task-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            transition: background-color 0.3s, border-left-color 0.3s;
            border-left: 6px solid transparent;
        }

        .task-card.arriving-deadline {
            border-left-color: #f39c12;
            background-color: #fff8e1;
        }

        .task-card.deadline-passed {
            border-left-color: #e74c3c;
            background-color: #ffe6e6;
        }

        .task-card.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .complete-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            color: #2c3e50;
            flex-shrink: 0;
            width: 110px;
        }

        .complete-checkbox input {
            margin-right: 6px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-title {
            font-weight: 700;
            font-size: 1.3rem;
            margin: 0;
            flex: 0 1 60%;
            cursor: text;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-responsible {
            flex: 0 1 30%;
            font-size: 0.95rem;
            color: #444;
            cursor: text;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Barra de progresso */
        .progress-bar-container {
            width: 100%;
            height: 16px;
            background: #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin: 12px 0 10px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: #2c3e50;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }

        .progress-text {
            font-size: 0.85rem;
            text-align: right;
            color: #555;
        }

        .task-footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .task-deadline {
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            max-width: 140px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #777;
            transition: color 0.2s;
            padding: 0;
            line-height: 1;
        }

        .task-actions button:hover {
            color: #2c3e50;
        }

        .steps-list {
            margin-top: 15px;
            padding-left: 0;
            list-style: none;
        }

        .steps-list li {
            margin-bottom: 12px;
            background: #fefefe;
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            cursor: text;
            box-shadow: 0 1px 4px rgb(0 0 0 / 0.05);
            transition: background-color 0.2s;
        }

        .steps-list li.completed-step {
            opacity: 0.5;
            text-decoration: line-through;
            background-color: #e0e0e0;
        }

        /* Ajuste para mostrar texto passo completo, com wrap */
        .step-text {
            flex: 1 1 65%;
            margin-right: 12px;
            outline: none;
            user-select: text;
            white-space: normal;
            overflow-wrap: break-word;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.3;
        }

        /* Responsável passo com largura menor */
        .step-responsible {
            flex: 0 0 120px;
            font-size: 0.85rem;
            color: #555;
            text-align: right;
            cursor: text;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 12px;
        }

        .step-actions {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .step-actions button {
            font-size: 1rem;
            color: #555;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
            padding: 0;
            line-height: 1;
        }

        .step-actions button:hover {
            color: #e74c3c;
        }

        .step-actions label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .step-actions label input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            #container {
                grid-template-columns: 1fr;
            }

            .task-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            .task-title,
            .task-responsible {
                flex: 1 1 100%;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }

            .complete-checkbox {
                width: auto;
            }

            .task-footer {
                justify-content: flex-start;
            }

            .step-text {
                flex: 1 1 60%;
            }

            .step-responsible {
                flex: 0 0 100px;
                margin-right: 8px;
            }
        }

        /* Formulário */
        #newTaskForm {
            max-width: 900px;
            margin: 0 auto 30px auto;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgb(0 0 0 / 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        #newTaskForm label {
            flex: 1 1 150px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        #newTaskForm input[type="text"],
        #newTaskForm input[type="date"] {
            width: 100%;
            max-width: 350px;
            height: 38px;
            padding: 8px 10px;
            border-radius: 5px;
            border: 1px solid #bbb;
            font-size: 1rem;
            box-sizing: border-box;
        }

        #newTaskForm button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: #2c3e50;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            flex: 1 1 120px;
        }

        #newTaskForm button:hover {
            background-color: #1a2733;
        }

        #newTaskForm .responsible-group {
            flex: 1 1 250px;
            display: flex;
            flex-direction: flex;
        }

        #newTaskForm .responsible-group label {
            margin-bottom: 4px;
        }

        /* Filtro */
        #searchInput {
            max-width: 900px;
            width: 100%;
            margin: 0 auto 20px auto;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #bbb;
            font-size: 1rem;
            display: block;
        }

        /* Botões Import/Export */
        #btnImport,
        #btnExport {
            max-width: 900px;
            margin: 0 auto 20px auto;
            display: inline-block;
            background-color: #2c3e50;
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #btnImport:hover,
        #btnExport:hover {
            background-color: #1a2733;
        }

        #fileInput {
            display: none;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <h1>Processos do setor LMS - Univ. Santo Amaro</h1>

    <form id="newTaskForm" aria-label="Adicionar nova tarefa">
        <label for="taskNameInput">Nome da Tarefa:</label>
        <input type="text" id="taskNameInput" placeholder="Ex: Aula ao Vivo" required autocomplete="off" />

        <div class="responsible-group">
            <label for="taskResponsibleInput">Responsável pela Tarefa:</label>
            <input type="text" id="taskResponsibleInput" placeholder="Nome ou cargo" required autocomplete="off" />
        </div>

        <label for="taskDeadlineInput">Prazo (opcional):</label>
        <input type="date" id="taskDeadlineInput" />

        <button type="submit">Adicionar Tarefa</button>
    </form>

    <label for="searchInput"></label>
    <input type="search" id="searchInput" placeholder="Digite para buscar..." autocomplete="off" />

    <center>
        <button id="btnImport" title="Importar tarefas de arquivo Excel">Importar Excel</button>
        <button id="btnExport" title="Exportar tarefas atuais para Excel">Exportar Excel</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </center>

    <div id="container" aria-live="polite" aria-relevant="additions removals"></div>

    <div id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <!-- SheetJS CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <script>
        let tasks = [];

        // --- Funções utilitárias ---

        function generateId() {
            return '_' + Math.random().toString(36).substr(2, 9);
        }

        function formatDateBR(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d)) return "";
            return d.toLocaleDateString("pt-BR");
        }

        function checkDeadline(deadline) {
            if (!deadline) return null;
            const today = new Date();
            const dl = new Date(deadline + "T23:59:59");
            const diff = dl - today;
            const days = diff / (1000 * 60 * 60 * 24);
            if (days < 0) return "expired";
            if (days <= 2) return "warning";
            return null;
        }

        // Calcula % de passos concluídos
        function calcProgress(task) {
            if (!task.steps || task.steps.length === 0) return 0;
            const done = task.steps.filter(s => s.completed).length;
            return Math.round((done / task.steps.length) * 100);
        }

        // Toast simples
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.opacity = "1";
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = "0";
            }, 3500);
        }

        // --- Persistência localStorage ---
        function loadTasks() {
            const data = localStorage.getItem("tasksLMS");
            if (data) {
                try {
                    tasks = JSON.parse(data);
                } catch {
                    tasks = [];
                }
            } else {
                // Inicializar com exemplo (opcional)
                tasks = [
                    {
                        id: generateId(),
                        name: "Aula ao Vivo",
                        deadline: null,
                        responsible: "João Silva",
                        completed: false,
                        steps: [
                            { text: "Abrir aula", responsible: "João Silva", completed: false },
                            { text: "Acompanhar a transmissão e dar suporte ao professor", responsible: "João Silva", completed: false }
                        ]
                    }
                ];
            }
        }

        function saveTasks() {
            localStorage.setItem("tasksLMS", JSON.stringify(tasks));
        }

        // --- Renderização ---
        const container = document.getElementById("container");
        const searchInput = document.getElementById("searchInput");

        function render(filter = "") {
            container.innerHTML = "";
            const filtroLower = filter.toLowerCase();
            tasks
                .filter(task =>
                    task.name.toLowerCase().includes(filtroLower) ||
                    task.responsible.toLowerCase().includes(filtroLower)
                )
                .forEach(task => {
                    const deadlineStatus = checkDeadline(task.deadline);

                    const card = document.createElement("article");
                    card.className = "task-card";
                    if (deadlineStatus === "warning") card.classList.add("arriving-deadline");
                    else if (deadlineStatus === "expired") card.classList.add("deadline-passed");
                    if (task.completed) card.classList.add("completed");
                    card.setAttribute("tabindex", "0");
                    card.setAttribute("aria-label", `Tarefa: ${task.name}, com ${task.steps.length} passos`);

                    const header = document.createElement("div");
                    header.className = "task-header";

                    const completeLabel = document.createElement("label");
                    completeLabel.className = "complete-checkbox";
                    completeLabel.title = "Marcar tarefa como concluída";
                    const completeCheckbox = document.createElement("input");
                    completeCheckbox.type = "checkbox";
                    completeCheckbox.checked = task.completed;
                    completeCheckbox.addEventListener("change", () => {
                        task.completed = completeCheckbox.checked;
                        saveTasks();
                        render(searchInput.value);
                        showToast(`Tarefa "${task.name}" ${task.completed ? "marcada como concluída" : "marcada como pendente"}.`);
                    });
                    completeLabel.appendChild(completeCheckbox);
                    completeLabel.appendChild(document.createTextNode("Concluída"));

                    const title = document.createElement("h2");
                    title.className = "task-title";
                    title.contentEditable = "true";
                    title.spellcheck = false;
                    title.textContent = task.name;
                    title.setAttribute("aria-label", "Editar nome da tarefa");
                    title.addEventListener("blur", e => {
                        const val = e.target.textContent.trim();
                        if (val.length === 0) {
                            e.target.textContent = task.name;
                            showToast("O nome da tarefa não pode ficar vazio.");
                            return;
                        }
                        task.name = val;
                        saveTasks();
                        showToast(`Nome da tarefa atualizado para "${val}"`);
                    });

                    const responsibleSpan = document.createElement("div");
                    responsibleSpan.className = "task-responsible";
                    responsibleSpan.contentEditable = "true";
                    responsibleSpan.spellcheck = false;
                    responsibleSpan.textContent = task.responsible;
                    responsibleSpan.title = "Editar responsável pela tarefa";
                    responsibleSpan.setAttribute("aria-label", "Editar responsável pela tarefa");
                    responsibleSpan.addEventListener("blur", e => {
                        const val = e.target.textContent.trim();
                        if (val.length === 0) {
                            e.target.textContent = task.responsible;
                            showToast("O responsável não pode ficar vazio.");
                            return;
                        }
                        task.responsible = val;
                        saveTasks();
                        showToast(`Responsável atualizado para "${val}"`);
                    });

                    header.appendChild(completeLabel);
                    header.appendChild(title);
                    header.appendChild(responsibleSpan);

                    card.appendChild(header);

                    // Barra de progresso dos passos
                    const progressPercent = calcProgress(task);
                    const progressContainer = document.createElement("div");
                    progressContainer.className = "progress-bar-container";
                    const progressFill = document.createElement("div");
                    progressFill.className = "progress-bar-fill";
                    progressFill.style.width = progressPercent + "%";
                    progressFill.setAttribute("aria-valuenow", progressPercent);
                    progressFill.setAttribute("aria-valuemin", 0);
                    progressFill.setAttribute("aria-valuemax", 100);
                    progressFill.setAttribute("role", "progressbar");
                    progressFill.setAttribute("aria-label", `Progresso da tarefa: ${progressPercent} por cento`);

                    progressContainer.appendChild(progressFill);

                    const progressText = document.createElement("div");
                    progressText.className = "progress-text";
                    progressText.textContent = progressPercent + "% concluído";

                    card.appendChild(progressContainer);
                    card.appendChild(progressText);

                    // Footer com prazo e botão editar prazo
                    const footer = document.createElement("div");
                    footer.className = "task-footer";

                    const deadlineDiv = document.createElement("div");
                    deadlineDiv.className = "task-deadline";

                    const deadlineText = document.createElement("span");
                    deadlineText.textContent = task.deadline ? formatDateBR(task.deadline) : "Sem prazo";
                    deadlineText.title = "Data do prazo (duplo clique para remover)";
                    deadlineText.style.userSelect = "none";
                    deadlineText.addEventListener("dblclick", () => {
                        if (confirm("Remover a data do prazo?")) {
                            task.deadline = null;
                            saveTasks();
                            render(searchInput.value);
                            showToast("Prazo removido.");
                        }
                    });

                    const btnEditDeadline = document.createElement("button");
                    btnEditDeadline.type = "button";
                    btnEditDeadline.title = "Editar data do prazo";
                    btnEditDeadline.textContent = "📅";
                    btnEditDeadline.style.cursor = "pointer";

                    const inputDeadline = document.createElement("input");
                    inputDeadline.type = "date";
                    inputDeadline.style.display = "none";
                    inputDeadline.value = task.deadline || "";

                    btnEditDeadline.addEventListener("click", () => {
                        if (inputDeadline.style.display === "none") {
                            inputDeadline.style.display = "inline-block";
                            inputDeadline.focus();
                        } else {
                            inputDeadline.style.display = "none";
                        }
                    });

                    inputDeadline.addEventListener("change", () => {
                        const val = inputDeadline.value;
                        if (val) {
                            task.deadline = val;
                            saveTasks();
                            render(searchInput.value);
                            showToast(`Prazo definido para ${formatDateBR(val)}`);
                        }
                        inputDeadline.style.display = "none";
                    });

                    deadlineDiv.appendChild(deadlineText);
                    deadlineDiv.appendChild(btnEditDeadline);
                    deadlineDiv.appendChild(inputDeadline);

                    footer.appendChild(deadlineDiv);

                    // Botão para remover tarefa
                    const btnRemoveTask = document.createElement("button");
                    btnRemoveTask.type = "button";
                    btnRemoveTask.title = "Remover tarefa";
                    btnRemoveTask.textContent = "🗑️";
                    btnRemoveTask.addEventListener("click", () => {
                        if (confirm(`Remover a tarefa "${task.name}"?`)) {
                            tasks = tasks.filter(t => t.id !== task.id);
                            saveTasks();
                            render(searchInput.value);
                            showToast("Tarefa removida.");
                        }
                    });

                    footer.appendChild(btnRemoveTask);

                    card.appendChild(footer);

                    // Passos (steps)
                    if (task.steps && task.steps.length > 0) {
                        const ul = document.createElement("ul");
                        ul.className = "steps-list";
                        task.steps.forEach((step, idx) => {
                            const li = document.createElement("li");
                            if (step.completed) li.classList.add("completed-step");

                            const stepText = document.createElement("div");
                            stepText.className = "step-text";
                            stepText.contentEditable = "true";
                            stepText.spellcheck = false;
                            stepText.textContent = step.text;
                            stepText.setAttribute("aria-label", `Editar passo ${idx + 1}`);
                            stepText.addEventListener("blur", e => {
                                const val = e.target.textContent.trim();
                                if (val.length === 0) {
                                    e.target.textContent = step.text;
                                    showToast("O texto do passo não pode ficar vazio.");
                                    return;
                                }
                                step.text = val;
                                saveTasks();
                            });

                            const stepResp = document.createElement("div");
                            stepResp.className = "step-responsible";
                            stepResp.contentEditable = "true";
                            stepResp.spellcheck = false;
                            stepResp.textContent = step.responsible;
                            stepResp.title = "Editar responsável pelo passo";
                            stepResp.setAttribute("aria-label", `Editar responsável pelo passo ${idx + 1}`);
                            stepResp.addEventListener("blur", e => {
                                const val = e.target.textContent.trim();
                                if (val.length === 0) {
                                    e.target.textContent = step.responsible;
                                    showToast("O responsável pelo passo não pode ficar vazio.");
                                    return;
                                }
                                step.responsible = val;
                                saveTasks();
                            });

                            // Checkbox para passo concluído
                            const stepCheckLabel = document.createElement("label");
                            stepCheckLabel.className = "step-actions";
                            const stepCheckbox = document.createElement("input");
                            stepCheckbox.type = "checkbox";
                            stepCheckbox.checked = step.completed;
                            stepCheckbox.title = "Marcar passo como concluído";
                            stepCheckbox.addEventListener("change", () => {
                                step.completed = stepCheckbox.checked;
                                saveTasks();
                                render(searchInput.value);
                            });

                            // Botão remover passo
                            const btnRemoveStep = document.createElement("button");
                            btnRemoveStep.textContent = "❌";
                            btnRemoveStep.title = "Remover passo";
                            btnRemoveStep.type = "button";
                            btnRemoveStep.addEventListener("click", () => {
                                if (confirm("Remover este passo?")) {
                                    task.steps.splice(idx, 1);
                                    saveTasks();
                                    render(searchInput.value);
                                    showToast("Passo removido.");
                                }
                            });

                            stepCheckLabel.appendChild(stepCheckbox);

                            const actionsDiv = document.createElement("div");
                            actionsDiv.className = "step-actions";
                            actionsDiv.appendChild(stepCheckLabel);
                            actionsDiv.appendChild(btnRemoveStep);

                            li.appendChild(stepText);
                            li.appendChild(stepResp);
                            li.appendChild(actionsDiv);

                            ul.appendChild(li);
                        });
                        card.appendChild(ul);
                    }

                    // Botão "Novo Passo"
                    const btnNovoPasso = document.createElement("button");
                    btnNovoPasso.textContent = "+ Novo Passo";
                    btnNovoPasso.title = "Adicionar novo passo à tarefa";
                    btnNovoPasso.style.marginTop = "10px";
                    btnNovoPasso.style.alignSelf = "flex-start";
                    btnNovoPasso.style.backgroundColor = "#2c3e50";
                    btnNovoPasso.style.color = "white";
                    btnNovoPasso.style.padding = "8px 14px";
                    btnNovoPasso.style.border = "none";
                    btnNovoPasso.style.borderRadius = "6px";
                    btnNovoPasso.style.cursor = "pointer";
                    btnNovoPasso.style.fontWeight = "600";
                    btnNovoPasso.addEventListener("click", () => {
                        const newStepText = prompt("Descrição do novo passo:");
                        if (!newStepText || newStepText.trim() === "") return;

                        const newStepResponsible = prompt("Responsável pelo novo passo:");
                        if (!newStepResponsible || newStepResponsible.trim() === "") return;

                        task.steps.push({
                            text: newStepText.trim(),
                            responsible: newStepResponsible.trim(),
                            completed: false
                        });
                        saveTasks();
                        render(searchInput.value);
                        showToast("Novo passo adicionado.");
                    });

                    card.appendChild(btnNovoPasso);


                    container.appendChild(card);
                });

            if (container.children.length === 0) {
                container.innerHTML = "<p style='text-align:center;color:#666;'>Nenhuma tarefa encontrada.</p>";
            }
        }

        // --- Eventos formulário nova tarefa ---
        const newTaskForm = document.getElementById("newTaskForm");
        const taskNameInput = document.getElementById("taskNameInput");
        const taskResponsibleInput = document.getElementById("taskResponsibleInput");
        const taskDeadlineInput = document.getElementById("taskDeadlineInput");

        newTaskForm.addEventListener("submit", e => {
            e.preventDefault();
            const name = taskNameInput.value.trim();
            const responsible = taskResponsibleInput.value.trim();
            const deadline = taskDeadlineInput.value || null;

            if (!name) {
                alert("Informe o nome da tarefa.");
                return;
            }
            if (!responsible) {
                alert("Informe o responsável pela tarefa.");
                return;
            }

            tasks.push({
                id: generateId(),
                name,
                responsible,
                deadline,
                completed: false,
                steps: []
            });
            saveTasks();
            render(searchInput.value);
            newTaskForm.reset();
            taskNameInput.focus();
            showToast("Tarefa adicionada.");
        });

        // --- Filtro ---
        searchInput.addEventListener("input", e => {
            render(e.target.value);
        });

        // --- Importar/Exportar Excel ---
        const btnImport = document.getElementById("btnImport");
        const btnExport = document.getElementById("btnExport");
        const fileInput = document.getElementById("fileInput");

        btnImport.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: "array" });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                // Espera colunas: name, responsible, deadline (opcional), completed (bool), steps (JSON string)
                tasks = jsonData.map(row => {
                    let steps = [];
                    if (row.steps) {
                        try {
                            steps = JSON.parse(row.steps);
                        } catch { }
                    }
                    return {
                        id: generateId(),
                        name: row.name || "Tarefa sem nome",
                        responsible: row.responsible || "Sem responsável",
                        deadline: row.deadline || null,
                        completed: row.completed === true || row.completed === "true",
                        steps: Array.isArray(steps) ? steps : []
                    };
                });
                saveTasks();
                render(searchInput.value);
                showToast("Tarefas importadas do Excel.");
            };
            reader.readAsArrayBuffer(file);
            fileInput.value = "";
        });

        btnExport.addEventListener("click", () => {
            // Exportar como Excel com colunas principais + steps como JSON string
            const exportData = tasks.map(t => ({
                name: t.name,
                responsible: t.responsible,
                deadline: t.deadline,
                completed: t.completed,
                steps: JSON.stringify(t.steps)
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Tarefas");
            XLSX.writeFile(workbook, "tarefas-lms.xlsx");
        });

        // Inicialização
        loadTasks();
        render();

    </script>

</body>

</html>
